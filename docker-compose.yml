services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
      # The public https:// address, for links in emails.
      R2_APP_URL: ${R2_APP_URL:-}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      RENTMAN_BASE_URL: ${RENTMAN_BASE_URL:-https://api.rentman.net}
      # Optional: only used by Settings > Import when no token is saved there.
      RENTMAN_API_TOKEN: ${RENTMAN_API_TOKEN:-}
      PRINTER_HOST: ${PRINTER_HOST:-}
      # 0: labels only go to printers through a print agent at each venue
      # (a cloud server can't reach their networks). 1 when R2 runs on the
      # same network as the printers and sends to them itself.
      R2_DIRECT_PRINTING: ${R2_DIRECT_PRINTING:-0}
      # "Find photo" on items: Ollama with a vision model, e.g.
      # http://host.docker.internal:11434 for one on the host. Unset, the
      # app doesn't offer it.
      R2_OLLAMA_URL: ${R2_OLLAMA_URL:-}
      R2_VISION_MODEL: ${R2_VISION_MODEL:-gemma4:12b-it-qat}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3001}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pb_data:
