services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    container_name: r2
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
      # The public https:// address, for links in emails.
      R2_APP_URL: ${R2_APP_URL:-}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      RENTMAN_BASE_URL: ${RENTMAN_BASE_URL:-https://api.rentman.net}
      # Optional: only used by Settings > Import when no token is saved there.
      RENTMAN_API_TOKEN: ${RENTMAN_API_TOKEN:-}
      PRINTER_HOST: ${PRINTER_HOST:-}
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

volumes:
  pb_data:
